<!--
/**
 * AI Content Generator Modal Template
 */
-->
<div class="ai-generator-modal ai-text-generator-modal-content">
    <div class="ai-inline-editor">
        <div class="editor-form">
            <div class="form-group">
                <label class="ai-label">
                    <span data-bind="i18n: 'Prompt'"></span>
                </label>
                <textarea class="ai-prompt-input"
                          rows="4"
                          data-bind="textInput: prompt,
                                     attr: { placeholder: promptPlaceholder },
                                     valueUpdate: 'afterkeydown'"></textarea>
            </div>

            <div class="form-group ai-form-row">
                <div class="ai-form-col">
                    <label class="ai-label">
                        <span data-bind="i18n: 'Content Type'"></span>
                    </label>
                    <select class="ai-select"
                            data-bind="value: contentType,
                                       valueUpdate: 'change'">
                        <option value="product_description" data-bind="i18n: 'Product Description'"></option>
                        <option value="category_description" data-bind="i18n: 'Category Description'"></option>
                        <option value="marketing_copy" data-bind="i18n: 'Marketing Copy'"></option>
                        <option value="blog_post" data-bind="i18n: 'Blog Post'"></option>
                        <option value="custom" data-bind="i18n: 'Custom'"></option>
                    </select>
                </div>

                <div class="ai-form-col">
                    <label class="ai-label">
                        <span data-bind="i18n: 'Additional Context'"></span>
                    </label>
                    <input type="text"
                           class="ai-context-input"
                           data-bind="textInput: context,
                                      attr: { placeholder: contextPlaceholder },
                                      valueUpdate: 'afterkeydown'">
                </div>
            </div>

            <div class="form-actions">
                <button type="button"
                        class="btn-generate"
                        data-bind="click: generateContent,
                                   css: { 'loading': isGenerating() },
                                   disable: isGenerating">
                    <span data-bind="visible: !isGenerating(), i18n: '⚡ Generate AI Content'"></span>
                    <span data-bind="visible: isGenerating, i18n: 'Generating...'"></span>
                </button>
            </div>
        </div>

        <!-- ko if: generatedContent -->
        <div class="ai-content-output">
            <div class="output-header">
                <h4 data-bind="i18n: 'Generated Content:'"></h4>
                <div class="output-actions">
                    <button type="button"
                            class="btn-insert"
                            data-bind="click: insertContent">
                        ➕ <span data-bind="i18n: 'Insert'"></span>
                    </button>
                    <button type="button"
                            class="btn-copy"
                            data-bind="click: copyContent">
                        📋 <span data-bind="i18n: 'Copy'"></span>
                    </button>
                </div>
            </div>
            <div class="output-content" data-bind="html: generatedContent"></div>
        </div>
        <!-- /ko -->

        <!-- ko ifnot: generatedContent -->
        <div class="ai-content-output ai-content-empty">
            <svg width="64" height="64" viewBox="0 0 64 64">
                <defs>
                    <linearGradient id="aiModalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"></stop>
                        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"></stop>
                    </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="28" fill="none" stroke="url(#aiModalGradient)" stroke-width="2"></circle>
                <path d="M 32,20 L 32,32 L 40,40" stroke="url(#aiModalGradient)" stroke-width="2" fill="none" stroke-linecap="round"></path>
                <circle cx="32" cy="32" r="3" fill="url(#aiModalGradient)"></circle>
            </svg>
            <p data-bind="i18n: 'Enter a prompt and click Generate to create AI content'"></p>
        </div>
        <!-- /ko -->
    </div>
</div>
