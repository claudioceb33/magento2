<!--
/**
 * AI Content Inline Editable Preview Template
 */
-->
<div class="pagebuilder-content-type ai-content-inline" 
     event="{ mouseover: onMouseOver, mouseout: onMouseOut }, mouseoverBubble: false">
    
    <div class="ai-inline-editor" 
         attr="data.main.attributes"
         ko-style="data.main.style"
         css="data.main.css">
        
        <div class="editor-form">
            <!-- Prompt Input -->
            <div class="form-group">
                <textarea class="ai-prompt-input" 
                          placeholder="Enter your prompt here... (e.g., 'Generate a product description for wireless headphones')"
                          data-bind="textInput: data.prompt, 
                                     valueUpdate: 'afterkeydown'"
                          rows="4"></textarea>
            </div>
            
            <!-- Options Row -->
            <div class="form-group" style="flex-direction: row; gap: 10px;">
                <select class="ai-select" 
                        data-bind="value: data.content_type, 
                                   valueUpdate: 'change'" 
                        style="flex: 1;">
                    <option value="product_description">Product Description</option>
                    <option value="category_description">Category Description</option>
                    <option value="marketing_copy">Marketing Copy</option>
                    <option value="blog_post">Blog Post</option>
                    <option value="custom">Custom</option>
                </select>
                
                <input type="text" 
                       class="ai-context-input" 
                       placeholder="Additional context (optional)"
                       data-bind="textInput: data.context,
                                  valueUpdate: 'afterkeydown'"
                       style="flex: 1;">
            </div>
            
            <!-- Generate Button -->
            <div class="form-actions">
                <button class="btn-generate" 
                        type="button"
                        data-bind="click: generateContent, 
                                   css: { 'loading': isGenerating() }, 
                                   disable: isGenerating()">
                    <span data-bind="visible: !isGenerating()">⚡ Generate AI Content</span>
                    <span data-bind="visible: isGenerating()">Generating...</span>
                </button>
            </div>
        </div>
        
        <!-- Generated Content Display -->
        <!-- ko if: generatedContent() -->
        <div class="ai-content-output">
            <div class="output-header">
                <h4>Generated Content:</h4>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-insert" 
                            type="button"
                            data-bind="click: insertAsTextBlock"
                            title="Insert as Page Builder text block">
                        ➕ Insert
                    </button>
                    <button class="btn-copy" 
                            type="button"
                            data-bind="click: copyContent"
                            title="Copy to clipboard">
                        📋 Copy
                    </button>
                </div>
            </div>
            <div class="output-content" data-bind="html: generatedContent"></div>
        </div>
        <!-- /ko -->
        
        <!-- Empty State -->
        <!-- ko ifnot: generatedContent() -->
        <div class="ai-content-output" style="background: #f8f9fa; text-align: center; padding: 40px 20px;">
            <svg width="64" height="64" viewBox="0 0 64 64" style="opacity: 0.3; margin-bottom: 15px;">
                <defs>
                    <linearGradient id="aiEmptyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"></stop>
                        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"></stop>
                    </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="28" fill="none" stroke="url(#aiEmptyGradient)" stroke-width="2"></circle>
                <path d="M 32,20 L 32,32 L 40,40" stroke="url(#aiEmptyGradient)" stroke-width="2" fill="none" stroke-linecap="round"></path>
                <circle cx="32" cy="32" r="3" fill="url(#aiEmptyGradient)"></circle>
            </svg>
            <p style="color: #667eea; font-size: 14px; margin: 0;">
                Enter a prompt above and click Generate to create AI content
            </p>
        </div>
        <!-- /ko -->
    </div>
    
    <render args="getOptions().template"></render>
</div>
