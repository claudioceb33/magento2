<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <!-- AI Content Icon - Sparkles and Document -->
    <defs>
        <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Document -->
    <rect x="12" y="8" width="40" height="48" rx="4" fill="url(#aiGradient)" opacity="0.2"/>
    <rect x="12" y="8" width="40" height="48" rx="4" fill="none" stroke="url(#aiGradient)" stroke-width="2"/>
    
    <!-- Lines representing text -->
    <line x1="18" y1="18" x2="46" y2="18" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="26" x2="42" y2="26" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="34" x2="46" y2="34" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="42" x2="38" y2="42" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    
    <!-- AI Sparkle/Star -->
    <g transform="translate(42, 46)">
        <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#667eea"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
    
    <!-- Small sparkles -->
    <circle cx="22" cy="12" r="1.5" fill="#667eea" opacity="0.8"/>
    <circle cx="38" cy="50" r="1.5" fill="#764ba2" opacity="0.8"/>
</svg>
