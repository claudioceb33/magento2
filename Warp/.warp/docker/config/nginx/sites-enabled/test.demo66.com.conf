upstream fastcgi_backend {
   server   php:9000;
}

server {
    listen                      80 default_server;
    listen                      443 default_server ssl http2;

    http2_push_preload on;
    http2_max_concurrent_pushes 15;

    fastcgi_buffers 32 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 300s;

    client_body_buffer_size 100K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    client_body_timeout 15;
    client_header_timeout 15;
    keepalive_timeout 75; #LB necessary
    send_timeout 15;

    client_max_body_size        25M;


    satisfy  any;
    allow 172.50.0.0/16;
    allow 192.168.0.0/16;
    deny   all;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    #server_name website.com  *.website.com;
    server_name local.demo66.com;

    ssl_certificate             /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key         /etc/nginx/ssl/privkey.pem;

    set                         $MAGE_ROOT /var/www/html;
    set                         $MAGE_MODE production;

    root $MAGE_ROOT/pub;

    index index.php;
    autoindex off;
    charset UTF-8;
    error_page 404 403 = /errors/404.php;

    # BotBlock protection
    include /etc/nginx/bots.d/blockbots.conf;
    include /etc/nginx/bots.d/ddos.conf;

    # Deny access to sensitive files
    location /.user.ini {
        deny all;
    }

    # Bloquear patrones comunes de inyección SQL y otros ataques
    location ~* "(select.+(from|union|sleep)|\.\./|etc/passwd|xmlrpc\.php|wp-config\.php|/.env|eval-stdin\.php|<script>|/wp-admin/|base64_encode|union.*select|/administrator|^/\.git|eval\(|insert.+into)|(\(|\)|<|>|%3C|%3E|%00|\|%7C|%27|%22|%3D|%2B|%2F|%5C)" {
        try_files $uri =404;
    }

    # Bloquear patrones comunes de inyección SQL y otros ataques en los parámetros de la cadena de consulta
    if ($query_string ~* "(select.+(from|union|sleep)|\.\./|etc/passwd|xmlrpc\.php|wp-config\.php|/.env|eval-stdin\.php|<script>|/wp-admin/|base64_encode|union.*select|/administrator|^/\.git|eval\(|insert.+into)") {
        return 403;
    }

    # Bloquear caracteres sospechosos en la cadena de consulta
    if ($query_string ~* "(\(|\)|<|>|%3C|%3E|%00|\|%7C|%27|%22|%3D|%2B|%2F|%5C)") {
        return 403;
    }

    # Capturar el encabezado X-Authorization-Bearer si existe
    set $bearer_token $http_x_authorization_bearer;

    # Proteccion antiSpam para customerAccount
    # /customer/account/ actua como un comodín, nginx aplicara la configuracion
    # definida en este bloque a todas las URL que comiencen con /customer/account/
    location /customer/account/ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        # Aplica limite de solicitudes
        limit_req zone=search_rate burst=1 nodelay;

        # Continua la ejecucion
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Proteccion DOS para catalogsearch
    location /catalogsearch/result/ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        # Aplica limite de solicitudes
        limit_req zone=search_rate burst=1 nodelay;

        # Continua la ejecucion
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /pub/ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        location ~ ^/pub/media/(downloadable|customer|import|theme_customization/.*\.xml) {
            deny all;
        }
        alias $MAGE_ROOT/pub/;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        # Uncomment the following line in production mode
        expires max;

        # Remove signature of the static files that is used to overcome the browser cache
        location ~ ^/static/version {
            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2|webp)$ {
            add_header Cache-Control "public";
            add_header X-Frame-Options "SAMEORIGIN";
	        include /etc/nginx/m2-cors.conf;
            expires +1y;

            if (!-f $request_filename) {
                rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
            }
        }
        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            add_header Cache-Control "no-store";
            add_header X-Frame-Options "SAMEORIGIN";
	        include /etc/nginx/m2-cors.conf;
            expires    off;

            if (!-f $request_filename) {
               rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
            }
        }
        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
        add_header X-Frame-Options "SAMEORIGIN";
	    include /etc/nginx/m2-cors.conf;
    }

    location /media/ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        try_files $uri $uri/ /get.php?$args;

        location ~ ^/media/theme_customization/.*\.xml {
            deny all;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2|webp)$ {
            add_header Cache-Control "public";
            add_header X-Frame-Options "SAMEORIGIN";
	        include /etc/nginx/m2-cors.conf;
            expires +1y;
            try_files $uri $uri/ /get.php?$args;
        }
        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            add_header Cache-Control "no-store";
            add_header X-Frame-Options "SAMEORIGIN";
	        include /etc/nginx/m2-cors.conf;
            expires    off;
            try_files $uri $uri/ /get.php?$args;
        }
        add_header X-Frame-Options "SAMEORIGIN";
	    include /etc/nginx/m2-cors.conf;
    }

    location /media/customer/ {
        deny all;
    }

    location /media/downloadable/ {
        deny all;
    }

    location /media/import/ {
        deny all;
    }

    # PHP entry point for main application
    location ~ (index|get|static|report|404|503)\.php$ {
        # BotBlock protection
        include /etc/nginx/bots.d/blockbots.conf;
        include /etc/nginx/bots.d/ddos.conf;

        try_files $uri =404;
        fastcgi_pass   fastcgi_backend;
        fastcgi_buffers 1024 4k;

        fastcgi_param  PHP_FLAG  "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param  PHP_VALUE "memory_limit=2048M \n max_execution_time=18000";
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;

        # Sobrescribir el encabezado Authorization con $bearer_token
        fastcgi_param HTTP_AUTHORIZATION "Bearer $bearer_token";

        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_vary on;

    # Banned locations (only reached if the earlier PHP entry point regexes don't match)
    location ~* (\.php$|\.htaccess$|\.git) {
        deny all;
    }
}
